[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blrpng"
version = "0.1.0"
description = "Boundary-Lifted Residual-Progress Newton Guidance for neural PDE operators"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "torch",
  "PyYAML",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blrpng*"]

