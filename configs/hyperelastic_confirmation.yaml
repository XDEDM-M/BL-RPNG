experiment:
  name: hyperelastic_confirmation
  seed: 20260820
  deterministic: true
  prerequisite_gate: artifacts/manifests/gray_scott_reconfirmation_gate.json
  artifact_dir: artifacts/experiments/hyperelastic_confirmation
data:
  equation: hyperelastic
  representation: lifted
  pretrain_resolution: 128
  support_resolution: 64
  query_resolutions: [128, 256]
  frozen_resolution: 512
  load_increments: 10
  query_load_increments: 20
  pretrain_cases: 500
  validation_cases: 100
  target_tasks: 30
  support_budgets: [1, 2, 4, 8]
  material_ood: true
  loading_profile_ood: true
model:
  in_channels: 8
  out_channels: 2
  condition_channels: 2
  modes1: 24
  modes2: 24
  width: 96
  layers: 6
  probe_mode: per_layer
  field_scales: [0.05, 0.03]
training:
  seeds: [42, 0, 1, 2, 3]
  epochs: 20
  batch_size: 4
  lr: 0.001
  weight_decay: 0.000001
  lr_scheduler: multistep
  lr_drop_epoch: 18
  lr_drop_gamma: 0.2
  path_layer: 1
  path_gradient_ratio: 0.15
  path_anneal_gamma: 2.0
  path_log_magnitude_weight: 0.1
  path_epsilon: 1.0e-8
resources:
  max_total_artifacts_gb: 300
  stage_budget_gb: 30
