experiment:
  name: navier_stokes_confirmation
  seed: 20260820
  deterministic: true
  prerequisite_gate: artifacts/manifests/hyperelastic_reconfirmation_gate.json
  artifact_dir: artifacts/experiments/navier_stokes_confirmation
data:
  equation: navier_stokes
  representation: lifted
  discretization: MAC
  time_integrator: BDF1
  nonlinear_solver: Newton-GMRES
  pretrain_resolution: 128
  support_resolution: 64
  query_resolutions: [128, 256]
  frozen_resolution: 512
  pretrain_cases: 500
  validation_cases: 100
  target_tasks: 30
  support_budgets: [1, 2, 4, 8]
  train_steps: 10
  query_steps: 50
  dt: 0.01
  reynolds_pretrain: [100, 200, 400]
  reynolds_ood: [800, 1000]
  solver_convergence_fraction: 0.99
  divergence_tolerance: 0.000001
  timing_cv_tolerance: 0.10
model:
  in_channels: 9
  out_channels: 3
  condition_channels: 1
  modes1: 24
  modes2: 24
  width: 96
  layers: 6
  probe_mode: per_layer
  field_scales: [1.0, 1.0, 0.1]
  gauge_channels: [2]
training:
  seeds: [42, 0, 1, 2, 3]
  epochs: 20
  batch_size: 4
  lr: 0.001
  weight_decay: 0.000001
  lr_scheduler: multistep
  lr_drop_epoch: 18
  lr_drop_gamma: 0.2
  path_layer: 1
  path_gradient_ratio: 0.15
  path_anneal_gamma: 2.0
  path_log_magnitude_weight: 0.1
  path_epsilon: 0.00000001
resources:
  max_total_artifacts_gb: 300
  stage_budget_gb: 55
  inference_batch_512: 1
